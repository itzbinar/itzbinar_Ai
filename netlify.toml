[build]
  publish = "build/client"
  command = "node netlify-build.js"

[build.environment]
  NODE_VERSION = "18"
  NPM_FLAGS = "--version"
  NODE_OPTIONS = "--max_old_space_size=6144"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  command = "pnpm run dev"
  port = 3000
  publish = "build/client" 